[path]
read-data=__PATH__executable__/../../data
write-data=/app/data

[graphics]
cache-sprite-atlas=true
v-sync=false
max-sprite-loading-threads=64
max-threads=64
graphics-quality=high
video-memory-usage=all
optimize-for-low-vram=false
texture-compression-level=high-quality
skip-vram-detection=true

[interface]
show-inserter-arrows-when-detailed-info-is-on=true
show-pump-arrows-when-detailed-info-is-on=true
show-mining-drill-arrows-when-detailed-info-is-on=true
show-combinator-settings-when-detailed-info-is-on=true
show-beacon-modules-in-alt-mode=true

[multiplayer]
username=CaptureWorker

[other]
check-updates=false
cache-prototype-data=true
