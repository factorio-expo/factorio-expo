# expo-postgres server settings, baked into the image (apps/expo-db/postgres/
# Dockerfile). Anything not set here keeps PostgreSQL's default. Rebuild and
# recreate expo-postgres after a change:
#   docker compose up -d --build expo-postgres

# The compose network reaches the server as expo-postgres:5432; only loopback
# publishes the port on the host (docker-compose.yaml).
listen_addresses = '*'

# Memory, sized for one machine shared with Factorio, Typesense and the
# apps. Adjust to your machine. Shared memory is only used as it fills, so the same
# values run on a development machine.
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 512MB

# The data disk is an SSD.
random_page_cost = 1.1

# Statement and idle-transaction timeouts are per app role (ALTER ROLE in
# apps/expo-db/lib.sh), so setup, migrations and manual work keep none.
